name: Feature request
description: Propose a bounded, measurable improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-visible problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and compatibility impact.
    validations:
      required: true
  - type: textarea
    id: measurement
    attributes:
      label: Measurement
      description: How should accuracy, reliability, latency, and resource use be compared?
    validations:
      required: true
