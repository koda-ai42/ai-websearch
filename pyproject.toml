[project]
name = "ai-websearch"
version = "0.1.0b1"
description = "Local-first web research for llama.cpp using SearXNG, local embeddings, and bounded reranking"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ai-websearch contributors" }]
keywords = ["llama.cpp", "mcp", "rag", "search", "searxng"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "numpy>=1.26.0",
  "beautifulsoup4>=4.12.0",
  "crawl4ai>=0.8.0",
  "sentence-transformers>=3.0.0",
  "PyYAML>=6.0.0"
]

[project.scripts]
ai-websearch = "ai_websearch.cli:main"

[dependency-groups]
dev = [
  "build>=1.2",
  "mypy>=1.16",
  "pytest>=8.0.0",
  "ruff>=0.12",
  "types-pyyaml>=6.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_ignores = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_websearch"]
